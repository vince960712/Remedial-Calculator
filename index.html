<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remedial Score Calculator</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;font-family:Segoe UI,Arial,sans-serif;
    background:linear-gradient(135deg,#eef2ff,#f8fafc);
    color:#1e293b;min-height:100vh;padding:24px
  }
  .app{max-width:980px;margin:auto}
  .header{
    background:#fff;border-radius:22px;padding:26px 30px;
    box-shadow:0 10px 30px rgba(15,23,42,.08);margin-bottom:20px
  }
  h1{margin:0 0 6px;font-size:30px;color:#1d4ed8}
  .subtitle{margin:0;color:#64748b}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .card{
    background:#fff;border-radius:22px;padding:24px;
    box-shadow:0 10px 30px rgba(15,23,42,.08)
  }
  .full{grid-column:1/-1}
  label{display:block;font-weight:700;margin:14px 0 7px}
  input,select{
    width:100%;padding:12px 14px;border:1px solid #cbd5e1;
    border-radius:12px;font-size:16px;background:#fff
  }
  input:focus,select:focus{outline:3px solid #dbeafe;border-color:#3b82f6}
  .formula{
    background:#eff6ff;border-left:5px solid #3b82f6;
    padding:14px;border-radius:10px;margin-top:16px;line-height:1.5
  }
  button{
    border:0;border-radius:12px;padding:13px 18px;font-size:16px;
    font-weight:700;cursor:pointer
  }
  .primary{background:#2563eb;color:#fff}
  .secondary{background:#e2e8f0;color:#334155}
  .danger{background:#fee2e2;color:#991b1b}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .result{
    display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px
  }
  .metric{background:#f8fafc;border-radius:14px;padding:16px;text-align:center}
  .metric small{display:block;color:#64748b;margin-bottom:5px}
  .metric strong{font-size:25px;color:#0f172a}
  .new-score{background:#dcfce7}
  .new-score strong{color:#15803d}
  .table-wrap{overflow:auto;margin-top:16px}
  table{width:100%;border-collapse:collapse;min-width:700px}
  th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:center}
  th{background:#f8fafc}
  .note{font-size:13px;color:#64748b;margin-top:8px}
  @media(max-width:720px){
    .grid{grid-template-columns:1fr}.full{grid-column:auto}
    .result{grid-template-columns:1fr}
    body{padding:12px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>📊 Remedial Score Calculator</h1>
    <p class="subtitle">Calculate a student's new score after taking a remedial test.</p>
  </div>

  <div class="grid">
    <section class="card">
      <h2>Student & Test Information</h2>
      <label>Student Name</label>
      <input id="student" placeholder="e.g., Juan Dela Cruz">
      <label>Test / Assessment</label>
      <input id="test" placeholder="e.g., 1st Quarter Test">
      <label>Maximum Test Score</label>
      <input id="max" type="number" min="1" step="0.01" value="50">
    </section>

    <section class="card">
      <h2>Scores</h2>
      <label>Original Test Score</label>
      <input id="original" type="number" min="0" step="0.01" placeholder="e.g., 28">
      <label>Remedial Test Score</label>
      <input id="remedial" type="number" min="0" step="0.01" placeholder="e.g., 42">
      <label>Remedial Scoring Method</label>
      <select id="method">
        <option value="higher">Use the higher score</option>
        <option value="average">Average original and remedial scores</option>
        <option value="gain">Original score + 50% of the score gain</option>
        <option value="replace">Replace with remedial score</option>
      </select>
      <div class="formula" id="formula"></div>
    </section>

    <section class="card full">
      <h2>Result</h2>
      <div class="result">
        <div class="metric"><small>Original Percentage</small><strong id="origPct">—</strong></div>
        <div class="metric"><small>Remedial Percentage</small><strong id="remPct">—</strong></div>
        <div class="metric new-score"><small>NEW SCORE</small><strong id="newScore">—</strong></div>
      </div>
      <div id="message" class="note"></div>
      <div class="actions">
        <button class="primary" onclick="calculate()">Calculate New Score</button>
        <button class="secondary" onclick="addRecord()">Add to Class List</button>
        <button class="secondary" onclick="window.print()">Print</button>
        <button class="danger" onclick="clearAll()">Clear</button>
      </div>
    </section>

    <section class="card full">
      <h2>Class Remedial Records</h2>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>#</th><th>Student</th><th>Test</th><th>Original</th>
            <th>Remedial</th><th>New Score</th><th>New %</th><th>Action</th>
          </tr></thead>
          <tbody id="records"></tbody>
        </table>
      </div>
      <div class="actions">
        <button class="secondary" onclick="exportCSV()">⬇ Export CSV</button>
        <button class="danger" onclick="clearRecords()">Clear Class List</button>
      </div>
    </section>
  </div>
</div>

<script>
let records = JSON.parse(localStorage.getItem("remedialRecords") || "[]");

const $ = id => document.getElementById(id);

function updateFormula(){
  const m=$("method").value;
  const text={
    higher:"New Score = higher of Original Score and Remedial Score.",
    average:"New Score = (Original Score + Remedial Score) ÷ 2.",
    gain:"New Score = Original Score + 50% × (Remedial Score − Original Score).",
    replace:"New Score = Remedial Score."
  };
  $("formula").innerHTML="<b>Formula:</b> "+text[m];
}
$("method").addEventListener("change",updateFormula);
updateFormula();

function values(){
  const max=Number($("max").value), o=Number($("original").value), r=Number($("remedial").value);
  if(!max || max<=0 || o<0 || r<0 || o>max || r>max){
    alert("Please enter valid scores. Both scores must be between 0 and the maximum score.");
    return null;
  }
  return {max,o,r};
}
function newScore(o,r){
  switch($("method").value){
    case "average": return (o+r)/2;
    case "gain": return o + 0.5*(r-o);
    case "replace": return r;
    default: return Math.max(o,r);
  }
}
function fmt(n){return Number(n).toFixed(2).replace(/\.00$/,"");}
function calculate(){
  const v=values(); if(!v)return null;
  const n=newScore(v.o,v.r);
  $("origPct").textContent=fmt(v.o/v.max*100)+"%";
  $("remPct").textContent=fmt(v.r/v.max*100)+"%";
  $("newScore").textContent=fmt(n)+" / "+fmt(v.max);
  $("message").textContent="New percentage: "+fmt(n/v.max*100)+"%";
  return {...v,n};
}
function addRecord(){
  const x=calculate(); if(!x)return;
  records.push({
    student:$("student").value.trim()||"Unnamed Student",
    test:$("test").value.trim()||"Remedial Test",
    original:x.o, remedial:x.r, newScore:x.n, max:x.max
  });
  localStorage.setItem("remedialRecords",JSON.stringify(records));
  render();
}
function render(){
  $("records").innerHTML=records.map((r,i)=>`
    <tr>
      <td>${i+1}</td><td>${esc(r.student)}</td><td>${esc(r.test)}</td>
      <td>${fmt(r.original)} / ${fmt(r.max)}</td>
      <td>${fmt(r.remedial)} / ${fmt(r.max)}</td>
      <td><b>${fmt(r.newScore)} / ${fmt(r.max)}</b></td>
      <td>${fmt(r.newScore/r.max*100)}%</td>
      <td><button class="danger" onclick="deleteRecord(${i})">Delete</button></td>
    </tr>`).join("");
}
function deleteRecord(i){
  records.splice(i,1);
  localStorage.setItem("remedialRecords",JSON.stringify(records));
  render();
}
function clearRecords(){
  if(confirm("Clear all saved class records?")){
    records=[];localStorage.removeItem("remedialRecords");render();
  }
}
function clearAll(){
  ["student","test","original","remedial"].forEach(id=>$(id).value="");
  $("origPct").textContent="—";$("remPct").textContent="—";$("newScore").textContent="—";
  $("message").textContent="";
}
function esc(s){
  return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function exportCSV(){
  if(!records.length){alert("No records to export.");return;}
  const rows=[["Student","Test","Original Score","Remedial Score","New Score","Maximum Score","New Percentage"]];
  records.forEach(r=>rows.push([r.student,r.test,r.original,r.remedial,r.newScore,r.max,(r.newScore/r.max*100).toFixed(2)+"%"]));
  const csv=rows.map(row=>row.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="remedial_scores.csv";a.click();
}
render();
</script>
</body>
</html>
